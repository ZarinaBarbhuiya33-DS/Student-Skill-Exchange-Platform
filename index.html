<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woxsen Skill Exchange | Connect</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4338ca;
            --secondary: #ec4899;
            --bg: #f1f5f9;
            --surface: #ffffff;
            --text-main: #1e293b;
            --text-light: #64748b;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar Navigation */
        .sidebar { width: 260px; background: var(--surface); padding: 25px 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.05); z-index: 10; display: flex; flex-direction: column; }
        .brand { font-size: 20px; font-weight: 800; color: var(--primary); margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .nav-item { padding: 12px 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--text-light); display: flex; align-items: center; gap: 12px; transition: all 0.3s; }
        .nav-item:hover, .nav-item.active { background: #e0e7ff; color: var(--primary); }
        
        /* User Profile Snippet */
        .profile-card { margin-top: auto; padding: 15px; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0; }
        .profile-card h4 { margin-bottom: 5px; color: var(--text-main); }
        .profile-card p { font-size: 12px; color: var(--text-light); margin-bottom: 8px; }
        .my-id-badge { background: #dcfce3; color: #15803d; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; font-family: monospace; word-break: break-all; }

        /* Main Content Area */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { font-size: 28px; }

        /* Views */
        .view-section { display: none; animation: fadeIn 0.4s ease-in-out; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Marketplace Grid */
        .request-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .request-card { background: var(--surface); border-radius: 16px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; transition: transform 0.2s; }
        .request-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .user-info h3 { font-size: 18px; margin-bottom: 2px; }
        .user-info p { font-size: 13px; color: var(--text-light); }
        
        .skills-row { margin: 15px 0; }
        .skill-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
        .offering { background: #dbeafe; color: #1d4ed8; }
        .seeking { background: #fce7f3; color: #be185d; }
        
        .connect-btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--primary); color: white; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px; }
        .connect-btn:hover { background: #312e81; }

        /* Video Room */
        .video-dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: calc(100vh - 120px); }
        .video-wrapper { background: #0f172a; border-radius: 16px; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .video-overlay { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); color: white; padding: 8px 16px; border-radius: 30px; font-size: 14px; backdrop-filter: blur(4px); }
        .controls { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 10px; }
        .control-btn { width: 45px; height: 45px; border-radius: 50%; border: none; background: rgba(255,255,255,0.2); color: white; font-size: 18px; cursor: pointer; backdrop-filter: blur(4px); transition: 0.3s; }
        .control-btn:hover { background: rgba(255,255,255,0.4); }
        .control-btn.end-call { background: #ef4444; }
        .control-btn.end-call:hover { background: #dc2626; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand"><i class="fas fa-graduation-cap"></i> SkillExchange</div>
        <div class="nav-item active" onclick="switchView('marketplace-view', this)">
            <i class="fas fa-compass"></i> Explore Requests
        </div>
        <div class="nav-item" onclick="switchView('video-view', this)">
            <i class="fas fa-video"></i> Video Room
        </div>

        <div class="profile-card">
            <h4>Zarina Yesmin</h4>
            <p>B.Tech Data Science</p>
            <p>Your Connection ID:</p>
            <div class="my-id-badge" id="my-peer-id">Generating...</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        
        <!-- Marketplace View -->
        <div id="marketplace-view" class="view-section active">
            <div class="header">
                <h1>Active Skill Requests</h1>
                <button class="connect-btn" style="width: auto; padding: 10px 20px;" onclick="switchView('video-view')">
                    <i class="fas fa-plus"></i> Post a Request
                </button>
            </div>
            
            <!-- Dynamic Grid Populated by JS -->
            <div class="request-grid" id="request-grid"></div>
        </div>

        <!-- Video Room View -->
        <div id="video-view" class="view-section">
            <div class="header">
                <h1 id="video-title">Video Exchange Room</h1>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="manual-peer-id" placeholder="Paste Peer ID here..." style="padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; width: 250px;">
                    <button class="connect-btn" style="width: auto; margin-top: 0;" onclick="initiateCall(document.getElementById('manual-peer-id').value)">Call</button>
                </div>
            </div>

            <div class="video-dashboard">
                <div class="video-wrapper">
                    <video id="local-video" autoplay muted playsinline></video>
                    <div class="video-overlay"><i class="fas fa-user"></i> You (Local)</div>
                    <div class="controls">
                        <button class="control-btn"><i class="fas fa-microphone"></i></button>
                        <button class="control-btn"><i class="fas fa-video"></i></button>
                    </div>
                </div>
                <div class="video-wrapper">
                    <video id="remote-video" autoplay playsinline></video>
                    <div class="video-overlay" id="remote-label"><i class="fas fa-user-graduate"></i> Waiting for peer...</div>
                    <div class="controls">
                        <button class="control-btn end-call" onclick="endCall()"><i class="fas fa-phone-slash"></i></button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
